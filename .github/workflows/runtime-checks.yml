# SPDX-License-Identifier: BSD-3-Clause
name: Runtime script checks
on:
  workflow_dispatch:
  push:
    paths: ['scripts/runtime/**', '.github/workflows/**', 'doc/runtime-*.md']
  pull_request:
    paths: ['scripts/runtime/**', '.github/workflows/**', 'doc/runtime-*.md']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 Pillow==11.3.0 psutil==7.0.0 ruff==0.14.10
      - run: python -m ruff check scripts/runtime
      - run: python -m ruff format --check scripts/runtime
      - run: python -m unittest discover -s scripts/runtime/tests -v
